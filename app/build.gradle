plugins { id 'com.android.application' }

def physicalDemo = providers.gradleProperty('physicalDemo').isPresent()

android {
    namespace 'com.lexinote.nativeapp'
    compileSdk 36
    defaultConfig {
        applicationId (physicalDemo ? 'com.lexinote.nativeapp.demo' : 'com.lexinote.nativeapp')
        manifestPlaceholders = [
            launcherLabel: physicalDemo ? 'LexiNote 演示' : '@string/app_name',
            callbackScheme: physicalDemo ? 'lexinote-demo' : 'lexinote',
            callbackHost: physicalDemo ? 'demo.invalid' : 'taskstream.xyz'
        ]
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.5.0-native'
        testInstrumentationRunner providers.gradleProperty('deviceRunner').getOrElse('com.lexinote.nativeapp.SmokeInstrumentation')
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    androidResources {
        noCompress 'onnx', 'db', 'zip'
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    // Sherpa-ONNX 1.13.8 includes the eSpeak frontend required by the Piper VITS model.
    implementation files('libs/sherpa-onnx.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20180813'
}
